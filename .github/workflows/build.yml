name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: mkdir -p www && cp index.html www/index.html
      - run: curl -fL --retry 3 https://api.alquran.cloud/v1/quran/quran-uthmani -o quran-raw.json
      - run: npm install
      - run: npx cap add android
      - run: node patch-android.js
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: waqfa-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v${{ github.run_number }} android/app/build/outputs/apk/debug/app-debug.apk --title "waqfa" --notes "APK"
